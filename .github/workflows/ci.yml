name: CI

on:
  push:
    branches: [L-route, master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required gate: static syntax checks + pure-unit taxonomy tests.
  # Matrix covers the oldest supported line (engines >=18 floor is 20 here)
  # and the current LTS. Zero dependencies: no lockfile, no npm cache,
  # nothing to install.
  unit-and-static:
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax-check every module
        run: |
          for f in lib/*.js openai.js anthropic.js main.js bin/cli.js; do
            node --check "$f" || exit 1
          done
      - run: node tests/taxonomy.mjs

  # Offline suites: no network, no credits — injected clock, TLS mock fixture,
  # fake HOME. These are the release gate. The matrix deliberately crosses all
  # three platforms because the vault roots, the OSCrypt KDF and the Claude Code
  # launcher all branch on the host OS; the macOS leg (Application Support roots,
  # PBKDF2 at 1003 iterations, a real `security` Keychain round-trip) is verified
  # here and nowhere else.
  offline-suites:
    needs: unit-and-static
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20
          - os: ubuntu-latest
            node-version: 24
          - os: windows-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: node tests/taxonomy.mjs
      - run: node tests/pen-test-p6.mjs
      - run: node tests/pen-test-p7.mjs
      - run: node tests/pen-test-p8.mjs
      - run: node tests/pen-test-p9.mjs
      - run: node tests/pen-test-p10.mjs
      - run: node tests/pen-test-p11.mjs
      - run: node tests/pen-test-p12.mjs
      - run: node tests/pen-test-p13.mjs
      - run: node tests/vault.mjs
      - run: node tests/secretservice.mjs
      - run: node tests/queue.mjs

  # Live-upstream suites: gated by cloud availability, so they run
  # continue-on-error and must never redden code PRs. Each uploads whatever
  # request logs its own workspace produced (workspaces are ephemeral — a
  # separate collector job would find nothing).
  pen-tests-fast:
    needs: unit-and-static
    continue-on-error: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node tests/pen-test-p1.mjs && node tests/pen-test-p2.mjs && node tests/pen-test-p3.mjs && node tests/pen-test-p4.mjs
      - name: Upload request logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ring-logs-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            proxy_requests*.json
            proxy_requests*.jsonl
          retention-days: 3
          if-no-files-found: ignore

  pen-tests-live:
    needs: unit-and-static
    continue-on-error: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node tests/pen-test-p5.mjs && node tests/catalog-refresh.mjs
      - name: Upload request logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ring-logs-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            proxy_requests*.json
            proxy_requests*.jsonl
          retention-days: 3
          if-no-files-found: ignore
