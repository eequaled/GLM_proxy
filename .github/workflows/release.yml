name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual re-run without pushing a new tag

permissions:
  contents: write # create the GitHub Release
  id-token: write # trusted publishing (OIDC): npm authenticates the workflow, no token needed

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # trusted publishing (OIDC): npm authenticates the workflow, no token needed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # no registry-url on purpose: OIDC trusted publishing needs no .npmrc
          # and a leftover auth token env makes npm skip the OIDC handshake

      # npm < 11.5.1 silently fails the OIDC token exchange and reports a
      # misleading 404 (npm/cli#9088). The runner's bundled npm can be older —
      # force a current one before publishing.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm i -g npm@latest

      - name: OIDC environment check
        run: |
          npm --version
          echo "oidc_url=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo present || echo MISSING)"
          echo "oidc_token=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && echo present || echo MISSING)"
          echo "gha=${GITHUB_ACTIONS:-unset}"

      - name: Syntax checks
        run: node --check openai.js && node --check anthropic.js && node --check lib/core.js && node --check lib/prompts.js && node --check bin/cli.js && node --check main.js

      - name: Unit tests (no upstream)
        run: node tests/taxonomy.mjs

      - name: Tag must match package.json version
        if: ${{ github.event_name == 'push' }} # only tag pushes; manual runs publish whatever version is in package.json
        run: |
          PKG_VERSION=$(npm pkg get version | tr -d '"')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json is $PKG_VERSION but tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Inspect tarball
        run: npm pack --dry-run

      # Trusted publishing: npm exchanges the workflow's OIDC token for a
      # short-lived publish credential — no NPM_TOKEN secret, no OTP, and
      # provenance is generated automatically. Configured on npmjs.com under
      # Package settings → Trusted Publisher (repo: eequaled/GLM_proxy,
      # workflow: release.yml, action: npm publish).
      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
